name: Offline regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: offline-reports-${{ matrix.os }}
          path: captures/runs/
          retention-days: 14
  runtime24:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: offline-reports-${{ matrix.os }}-node-24.21.0
          path: captures/runs/
          retention-days: 14
